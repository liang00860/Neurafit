server:
  port: 8001

# 添加以下配置，支持命令行参数覆盖端口
spring:
  application:
    name: cloud-payment-service

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://peer1:8761/eureka/,http://peer2:8762/eureka/,http://peer3:8763/eureka/
  instance:
    instance-id: payment-${server.port}   # 动态显示端口号
    prefer-ip-address: true

logging:
  level:
    com.cloud: debug
    com.netflix.discovery: ERROR
  charset:
    console: UTF-8
    file: UTF-8
